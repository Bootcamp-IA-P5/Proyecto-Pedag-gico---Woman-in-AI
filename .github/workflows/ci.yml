name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        working-directory: ./backend
        run: uv sync
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Lint
        working-directory: ./backend
        run: uv run ruff check .

      - name: Tests
        working-directory: ./backend
        run: uv run pytest
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPEN_ROUTER_KEY:     ${{ secrets.OPEN_ROUTER_KEY }}
          OPEN_ROUTER_URL:     ${{ secrets.OPEN_ROUTER_URL }}
          OPEN_ROUTER_MODEL:   ${{ secrets.OPEN_ROUTER_MODEL }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          LANGCHAIN_TRACING_V2: "false"  
          ENVIRONMENT:         test

      - name: Build Docker Image (Dry Run)
        working-directory: ./backend
        run: docker build -t test-backend .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}   
      
      - name: Build Docker Image (Dry Run)
        working-directory: ./frontend
        run: docker build -t test-frontend .
