name: Deploy to Sliplane

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Asegura que el nombre de la imagen esté en minúsculas
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # No necesitas configurar esto, Github te lo provee

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-sliplane-deploy:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend a Sliplane
        # Debes agregar la url del Webhook de Sliplane en la sección de "Secrets" de tu repositorio.
        run: curl -X POST "${{ secrets.SLIPLANE_WEBHOOK_BACKEND }}"

      - name: Deploy frontend a Sliplane
        run: curl -X POST "${{ secrets.SLIPLANE_WEBHOOK_FRONTEND }}"
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"